<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register to UniPrep — Access your university study resources, AI tutor, and MCQ practice.">
  <title>Create Account — UniPrep</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Theme Script (Load first to prevent FOUC) -->
  <script src="js/theme.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <main class="login-page">
    <div class="login-card">
      <div class="login__header" style="position: relative;">
        <div style="position: absolute; top: -10px; right: -10px;">
          <button class="btn" style="padding: 8px;" onclick="toggleTheme()" aria-label="Toggle Dark Mode">
            <i data-lucide="moon" class="theme-toggle-icon" style="width:20px;height:20px;"></i>
          </button>
        </div>
        <a href="index.html" class="login__logo" aria-label="UniPrep Home">
          <span class="login__logo-icon">
            <i data-lucide="graduation-cap" style="width:22px;height:22px;"></i>
          </span>
          UniPrep
        </a>
        <h1 class="login__title">Create Account</h1>
        <p class="login__subtitle">Sign up to access your study resources</p>
      </div>

      <div class="login__body">
        <!-- Login form — frontend-only, no backend integration yet -->
        <form class="login__form" id="register-form" action="#" method="POST" novalidate>
          <div class="form-group">
            <label for="name" class="form-group__label">Full Name</label>
            <input
              type="text"
              id="name"
              name="name"
              class="form-group__input"
              placeholder="John Doe"
              required
              aria-required="true"
            >
          </div>
          <div class="form-group">
            <label for="email" class="form-group__label">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-group__input"
              placeholder="you@university.edu"
              autocomplete="email"
              required
              aria-required="true"
            >
          </div>

          <div class="form-group">
            <label for="password" class="form-group__label">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-group__input"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
              aria-required="true"
            >
          </div>

          <div class="login__options">
            <label class="login__remember">
              <input type="checkbox" name="remember" id="remember">
              Remember me
            </label>
            <a href="#" class="login__forgot">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn--primary btn--lg login__submit">
            <i data-lucide="log-in" style="width:18px;height:18px;"></i>
            Sign In
          </button>
        </form>

        <div class="login__divider">
          <span class="login__divider-line"></span>
          <span class="login__divider-text">Already have an account?</span>
          <span class="login__divider-line"></span>
        </div>

        <p class="login__signup-text">
          <a href="login.html" class="login__signup-link">Sign in here</a> to continue preparing.
        </p>
      </div>
    </div>

    <div class="login__back">
      <a href="index.html" class="login__back-link">
        <i data-lucide="arrow-left" style="width:16px;height:16px;"></i>
        Back to Home
      </a>
    </div>
  </main>

  <script>
    lucide.createIcons();

    document.getElementById('register-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const submitBtn = this.querySelector('button[type="submit"]');

      if (!name || !email || !password) {
        alert('Please fill in all fields.');
        return;
      }

      // Add loading state
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<i data-lucide="loader-2" class="spin" style="width:18px;height:18px;"></i> Creating Account...';
      submitBtn.disabled = true;
      lucide.createIcons();

      try {
        const response = await fetch('https://unisprep-bach.onrender.com/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });

        const data = await response.json();

        if (response.ok) {
          alert('Account created successfully! Please login.');
          window.location.href = 'login.html';
        } else {
          alert(data.error || 'Registration failed.');
        }
      } catch (err) {
        alert('Error connecting to server. Please try again later.');
      } finally {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
